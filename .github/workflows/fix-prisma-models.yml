name: Fix Prisma Schema Syntax

on:
  push:
    paths:
      - ".github/workflows/fix-prisma-models.yml"
      - "prisma/schema.prisma"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize Prisma model and enum declarations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("prisma/schema.prisma")
          text = path.read_text(encoding="utf-8-sig")

          text = re.sub(
              r"^type ([A-Za-z_][A-Za-z0-9_]*) \{$",
              r"model \1 {",
              text,
              flags=re.MULTILINE,
          )

          def enum_rewrite(match):
              name = match.group(1)
              values = match.group(2).split()
              body = "\n".join(f"  {value}" for value in values)
              return f"enum {name} {{\n{body}\n}}"

          text = re.sub(
              r"^enum ([A-Za-z_][A-Za-z0-9_]*) \{\s*([^{}\n]+?)\s*\}$",
              enum_rewrite,
              text,
              flags=re.MULTILINE,
          )

          organization_fields = [
              "  productCategories ProductCategory[]",
              "  sales            Sale[]",
              "  expenses         Expense[]",
              "  arInvoices       ArInvoice[]",
              "  apBills          ApBill[]",
          ]

          match = re.search(r"model Organization \{(.*?)^\}", text, flags=re.MULTILINE | re.DOTALL)
          if match:
              block = match.group(0)
              additions = [line for line in organization_fields if line.split()[0] not in block]
              if additions:
                  block = block.rsplit("\n}", 1)[0] + "\n" + "\n".join(additions) + "\n}"
                  text = text[:match.start()] + block + text[match.end():]

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit schema syntax fix
        run: |
          if git diff --quiet -- prisma/schema.prisma; then
            echo "No Prisma syntax changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "fix(prisma): complete organization relations"
          git push
