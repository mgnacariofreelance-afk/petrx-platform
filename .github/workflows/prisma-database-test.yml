name: Prisma Database Test

on:
  push:
    paths:
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - "prisma/seed.js"
      - "package.json"
      - ".github/workflows/prisma-database-test.yml"
  pull_request:
    paths:
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - "prisma/seed.js"
      - "package.json"
      - ".github/workflows/prisma-database-test.yml"

jobs:
  database-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: petrx
          POSTGRES_PASSWORD: petrx
          POSTGRES_DB: petrx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petrx -d petrx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://petrx:petrx@localhost:5432/petrx_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run RBAC seed
        run: npx prisma db seed
