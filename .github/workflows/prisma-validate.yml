name: Prisma Schema Validation

on:
  push:
    paths:
      - 'prisma/schema.prisma'
      - '.github/workflows/prisma-validate.yml'
  pull_request:
    paths:
      - 'prisma/schema.prisma'
      - '.github/workflows/prisma-validate.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/petrx_validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Prisma schema
        run: |
          echo "Validating current PetRx Prisma schema"
          npx --yes prisma@6 validate --schema=prisma/schema.prisma
